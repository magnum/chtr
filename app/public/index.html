    <title>chtr proxy</title>
  </head>
  <body>
    <p>chtr proxy. Each extension has a channel. It writes to <code>/webhook/extension/&lt;connection_id&gt;</code>, reads replies from <code>/webhook/bot/&lt;connection_id&gt;</code>, and the Bot runs JavaScript in the open window at <code>/webhook/bot/&lt;connection_id&gt;/mcp</code>.</p>
